[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustguard-core"
version = "0.1.0"
description = "Estate Planning & Trust Fiduciary Ledger, Beneficiary Waterfall Engine & AI Estate Companion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "bi3n", email = "Muybi3n@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "estate-planning",
    "trusts",
    "wills",
    "fiduciary",
    "probate-avoidance",
    "asset-protection",
    "beneficiary-waterfall",
    "wealth-succession",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
]

[project.scripts]
trustguard = "trustguard.cli:main"

[project.urls]
Homepage = "https://github.com/Muybi3n/AI_Projects"
Repository = "https://github.com/Muybi3n/AI_Projects.git"
Issues = "https://github.com/Muybi3n/AI_Projects/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "BLE"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

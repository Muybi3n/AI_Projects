[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medcadence-core"
version = "0.1.0"
description = "Personal Health Telemetry, Lab Biomarker Ledger, Medication Interaction Checker & AI Health Companion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "bi3n", email = "Muybi3n@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "health-telemetry",
    "biomarkers",
    "lab-results",
    "medication-interactions",
    "wearables",
    "preventative-health",
    "local-first",
    "ai-health-companion",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
]

[project.scripts]
medcadence = "medcadence.cli:main"

[project.urls]
Homepage = "https://github.com/Muybi3n/AI_Projects"
Repository = "https://github.com/Muybi3n/AI_Projects.git"
Issues = "https://github.com/Muybi3n/AI_Projects/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "BLE"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subwatch-engine"
version = "0.1.0"
description = "Local-first subscription price-creep auditor, renewal alert radar & recurring SaaS optimizer."
readme = "README.md"
authors = [{ name = "Muybi3n", email = "Muybi3n@users.noreply.github.com" }]
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "subscriptions",
    "saas-management",
    "personal-finance",
    "price-creep",
    "cost-optimization",
    "budgeting",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
]

[project.scripts]
subwatch = "subwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=subwatch --cov-report=term-missing --cov-report=xml"

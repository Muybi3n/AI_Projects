[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "socmesh-audit"
version = "0.1.0"
description = "Homelab & Mini-SOC Telemetry Normalizer, Threat Correlation Engine & Alert Triage Governor (Wazuh, Pi-hole, Linux Auth)."
readme = "README.md"
authors = [
    { name = "bi3n", email = "Muybi3n@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "cybersecurity",
    "blue-team",
    "mini-soc",
    "wazuh",
    "pihole",
    "threat-hunting",
    "mitre-att-ck",
    "siem",
    "log-correlation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Logging"
]
dependencies = [
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0"
]

[project.scripts]
socmesh = "socmesh.cli:main"

[project.urls]
Homepage = "https://github.com/Muybi3n/AI_Projects"
Repository = "https://github.com/Muybi3n/AI_Projects"
"Bug Tracker" = "https://github.com/Muybi3n/AI_Projects/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=socmesh --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

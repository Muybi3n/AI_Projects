[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nasroute-core"
version = "0.1.0"
description = "Homelab & document storage routing engine with deterministic taxonomy, integrity hashing, and tier management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "bi3n", email = "Muybi3n@users.noreply.github.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.4.0", "build>=1.0.0"]

[project.scripts]
nasroute = "nasroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "BLE"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
